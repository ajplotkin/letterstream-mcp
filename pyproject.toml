[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "letterstream-mcp"
version = "0.1.0"
description = "MCP server for LetterStream certified mail, built around a submit/authorize gate for irreversible actions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["mcp", "letterstream", "certified-mail", "agent-safety"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Communications",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
dev = ["pytest>=7.0"]

[project.scripts]
letterstream-mcp = "letterstream_mcp.cli:main"
letterstream-mcp-server = "letterstream_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
